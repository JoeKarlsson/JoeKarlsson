name: Refresh README cards

on:
  schedule:
    - cron: "17 6 * * *" # just after midnight in Saint Paul
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt && python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s scripts
      - run: python scripts/readme_cards.py nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the new cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || { git commit -m "chore: Refresh the README cards" && git push; }
